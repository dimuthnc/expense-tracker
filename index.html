    <!-- Apply the stored theme before first paint so a light-theme user never sees a dark flash.
         Must stay in sync with useTheme (storage key + attribute/class names). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('et_theme');
          var root = document.documentElement;
          if (t === 'light') {
            root.setAttribute('data-fx-theme', 'light');
          } else {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
